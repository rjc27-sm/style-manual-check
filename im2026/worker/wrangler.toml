# Proof Positive (IM2026) - Worker configuration
# Deploy with: npx wrangler deploy   (from this folder)
# See ../DEPLOY.md for the full step-by-step guide.

name = "im2026-proof-positive"
main = "worker.js"
compatibility_date = "2026-06-01"

# KV namespace for rate-limit counters.
# Create it with: npx wrangler kv namespace create RATE_KV
# then paste the id it prints below.
[[kv_namespaces]]
binding = "RATE_KV"
id = "3cace9b99cdd430ba1a873add185c670"

[vars]
# Locked to the GitHub Pages origin (3 July 2026). Browser calls from any
# other website are refused. To allow local testing temporarily, set this
# back to "" and redeploy - but re-lock it afterwards.
ALLOWED_ORIGINS = "https://rjc27-sm.github.io"
# All endpoints run on Sonnet: these tools are about editorial finesse, and at
# the current usage caps the cost difference over Haiku is negligible.
MODEL = "claude-sonnet-5"
# STRONG_MODEL/ASK_MODEL are now the same as MODEL (kept for the spec.strong
# path and backward compatibility; harmless while every endpoint uses Sonnet).
STRONG_MODEL = "claude-sonnet-5"
ASK_MODEL = "claude-sonnet-5"
# PAGES_BASE_URL is gone (17 Aug 2026). The Style Manual page text is bundled
# into the Worker as pages-content.js instead of being served from the public
# im2026/pages/ folder, so there is nothing to fetch and nothing published.
IP_DAILY_LIMIT = "150"
# Raised from 500 for the IM2026 judging window (Jul 2026) so a judge can
# never hit "daily limit reached" mid-demo. Consider dropping back after.
GLOBAL_DAILY_LIMIT = "1000"

# The API key is a SECRET, never a var. Set it with:
#   npx wrangler secret put ANTHROPIC_API_KEY
# (it will prompt you to paste the key - nothing is stored in this file)
