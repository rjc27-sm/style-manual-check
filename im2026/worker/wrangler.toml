# Proof Positive (IM2026) - Worker configuration
# Deploy with: npx wrangler deploy   (from this folder)
# See ../DEPLOY.md for the full step-by-step guide.

name = "im2026-proof-positive"
main = "worker.js"
compatibility_date = "2026-06-01"

# KV namespace for rate-limit counters.
# Create it with: npx wrangler kv namespace create RATE_KV
# then paste the id it prints below.
[[kv_namespaces]]
binding = "RATE_KV"
id = "3cace9b99cdd430ba1a873add185c670"

# Analytics Engine dataset for usage measurement (22 August 2026). Aggregate
# counts only: the feature used, and the country/state/network the request came
# from. No text and no addresses - see the record() helper in worker.js.
# Writes here do NOT count against the KV write budget, which matters: the free
# KV plan allows 1,000 writes a day and each AI call already spends two.
[[analytics_engine_datasets]]
binding = "PP_ANALYTICS"
dataset = "pp_usage"

[vars]
# Locked to the GitHub Pages origin (3 July 2026). Browser calls from any
# other website are refused. To allow local testing temporarily, set this
# back to "" and redeploy - but re-lock it afterwards.
ALLOWED_ORIGINS = "https://rjc27-sm.github.io"
# All endpoints run on Sonnet: these tools are about editorial finesse, and at
# the current usage caps the cost difference over Haiku is negligible.
MODEL = "claude-sonnet-5"
# STRONG_MODEL/ASK_MODEL are now the same as MODEL (kept for the spec.strong
# path and backward compatibility; harmless while every endpoint uses Sonnet).
STRONG_MODEL = "claude-sonnet-5"
ASK_MODEL = "claude-sonnet-5"
# PAGES_BASE_URL is gone (17 Aug 2026). The Style Manual page text is bundled
# into the Worker as pages-content.js instead of being served from the public
# im2026/pages/ folder, so there is nothing to fetch and nothing published.
# 150 -> 400 on 22 Aug 2026. The per-IP cap had never stopped anything real -
# the only callers ever to hit it were us, testing - while testers who share an
# agency gateway all count as ONE IP, so a dozen active people behind one
# address could be refused silently. GLOBAL_DAILY_LIMIT is the actual cost
# ceiling and stays where it is: at the measured ~1.9c a call it caps a day at
# roughly $19, and the busiest day so far was 165 calls ($3.10, 17 Aug).
IP_DAILY_LIMIT = "400"
# Raised from 500 for the IM2026 judging window (Jul 2026) so a judge can
# never hit "daily limit reached" mid-demo. Consider dropping back after.
GLOBAL_DAILY_LIMIT = "1000"
# Prefix for the rate-counter keys. EMPTY IN PRODUCTION - do not set it here.
# Pass it on the command line so a test session writes its own counters and
# cannot spend the real users' budget:
#   npx wrangler dev --remote --var RATE_KEY_PREFIX:dev- --var IP_DAILY_LIMIT:100000
# A separate [env.dev] with its own KV namespace was considered and rejected:
# it makes a second Worker script, which needs its OWN copy of the API key
# secret. One fewer place the key lives is worth more than the tidier config.

# The API key is a SECRET, never a var. Set it with:
#   npx wrangler secret put ANTHROPIC_API_KEY
# (it will prompt you to paste the key - nothing is stored in this file)
#
# IP_HASH_SALT is also a secret. It turns a visitor address into a one-way daily
# code, so the rate limiter can count a caller without the address ever being
# stored. Any long random string will do; changing it only resets that day's
# counters. Set it with:
#   npx wrangler secret put IP_HASH_SALT
